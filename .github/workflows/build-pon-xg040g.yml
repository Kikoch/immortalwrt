name: Build XG-040G-MD (PON)

# 本仓库就是 immortalwrt 源码树的 fork, 不需要再 clone 源码。
# PON 相关的内容全部放在 pon-build/ 下, 与上游文件零重叠, 便于日后 rebase 上游。

on:
  workflow_dispatch:
    inputs:
      pin_feeds:
        description: '用 pon-build/feeds.conf 里固定的 feed 提交 (可复现)'
        required: true
        default: 'yes'
        type: choice
        options: ['yes', 'no']
      extra_config:
        description: '附加包配置'
        required: true
        default: 'none'
        type: choice
        options: ['none', 'xg040g-extra.config']
      pon_925:
        description: '注入 925 (PON PPE 卸载元数据, 上游没有)'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
      release_type:
        description: '发布方式'
        required: true
        default: 'none'
        type: choice
        options: ['none', 'release', 'prerelease']
  # push 触发: 改了 PON 实现或包配置就自动编一次, 不用手动点。
  # ⚠️ inputs 上下文在 push 事件下是空的, 下面每个用到 inputs 的地方都必须
  #    写成 `inputs.xxx || '默认值'`, 否则会走到 else 分支甚至 cat 一个目录。
  #    默认分支是 master (纯上游), 本 workflow 只存在于 pon-xg040g-inline,
  #    push 到该分支时用该分支上的这份文件触发。
  push:
    branches:
      - pon-xg040g-inline
    paths:
      - "target/linux/airoha/**"
      - "package/airoha-pon/**"
      - "pon-build/configs/**"
      - "pon-build/scripts/**"
      - "pon-build/feeds.conf"
      - ".github/workflows/build-pon-xg040g.yml"

env:
  DEVICE: nokia_xg-040g-md-ubi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 版本号
        id: ver
        run: |
          build_date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          repo_commit=$(git rev-parse --short=8 HEAD)
          echo "date=$build_date" >> $GITHUB_OUTPUT
          echo "commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "tag=${build_date}-${repo_commit}" >> $GITHUB_OUTPUT

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            xsltproc zstd

      - name: 安装 feeds
        env:
          PIN_FEEDS: ${{ inputs.pin_feeds || 'yes' }}
        run: |
          # scripts/feeds 的 parse_file 用 s/#.+$// 剥注释, 要求 # 后至少有一个字符。
          # 孤立 # 剥不掉, 随后被当成配置项解析 -> die "Syntax error ...", exit 25。
          # run #1 在 18 秒内就死在这里, 加断言让原因一眼可见。
          if grep -nE '^\s*#\s*$' pon-build/feeds.conf; then
            echo "FATAL: feeds.conf 含孤立 # 行, scripts/feeds 会以退出码 25 挂掉" >&2
            exit 1
          fi
          # feeds.conf 在上游 .gitignore 里, 所以固定清单放在 pon-build/ 下, 构建时拷到根目录
          if [ "$PIN_FEEDS" = "yes" ]; then
            cp pon-build/feeds.conf feeds.conf
          else
            sed 's/\^[0-9a-f]\{40\}$//' pon-build/feeds.conf > feeds.conf
          fi
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 清理 hardware-support 的 USERID 组冲突
        # 上游新增的 package/system/hardware-support 给 9 个 feature-gate 子包
        # 声明了 USERID (含 :scanner=47), 与 pin 住的 feeds/packages/sane-backends
        # 同名系统组撞车 -> `Failed to build tmp/.config-package.in`, make defconfig
        # 在 prepare-tmpinfo 阶段直接 Error 1 (run #3 实测, exit 2)。
        # 这些子包都没被选中, 清掉 USERID 行对产物无影响。
        # 幂等: 上游修好后文件不存在或已无 USERID 行, 这里就是 no-op。
        run: |
          hw=package/system/hardware-support/Makefile
          if [ -f "$hw" ]; then
            before=$(grep -c 'USERID' "$hw" || true)
            sed -i -E '/^[[:space:]]*USERID[[:space:]]*:=/d' "$hw"
            after=$(grep -c 'USERID' "$hw" || true)
            echo "hardware-support: USERID 行 $before -> $after"
          else
            echo "$hw 不存在 (上游可能已修复), 跳过"
          fi

      - name: 应用本地内核补丁
        env:
          SRC_DIR: ${{ github.workspace }}
          REPO_DIR: ${{ github.workspace }}/pon-build
          PON_925: ${{ inputs.pon_925 || 'no' }}
        run: bash pon-build/scripts/apply-local-patches.sh

      - name: 组装 .config
        env:
          SRC_DIR: ${{ github.workspace }}
          DEVICE_MODEL: XG-040G-MD
          BUILD_DATE: ${{ steps.ver.outputs.date }}
          REPO_COMMIT: ${{ steps.ver.outputs.commit }}
          UPSTREAM_COMMIT: ${{ steps.ver.outputs.commit }}
          EXTRA_CONFIG: ${{ inputs.extra_config || 'xg040g-extra.config' }}
        run: |
          cp pon-build/configs/xg040g.config .config
          if [ "$EXTRA_CONFIG" != "none" ]; then
            cat "pon-build/configs/$EXTRA_CONFIG" >> .config
          fi
          bash pon-build/scripts/set-build-version.sh .config
          # 匿名访问拿不到 job 日志 (API 下载要求 admin), 网页日志又是异步渲染。
          # 把失败输出用 ::error:: 写成 annotation —— 它会静态出现在 run 页面,
          # 排障时不用登录也能读到根因。
          if ! make defconfig > defconfig.log 2>&1; then
            tail -40 defconfig.log
            printf '::error::make defconfig 失败:: %s\n' \
              "$(tail -25 defconfig.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 2
          fi
          if ! bash pon-build/scripts/check-config.sh > check-config.log 2>&1; then
            cat check-config.log
            # 全量塞进 annotation: run #4 只贴尾 25 行, 把开头的 FATAL 截掉了,
            # 明明所有包都 OK 却仍判失败, 看不到根因。脚本输出约 30 行, 远小于
            # annotation 的 65535 字符上限。
            printf '::error::check-config 失败:: %s\n' \
              "$(sed ':a;N;$!ba;s/\n/%0A/g' check-config.log)"
            exit 1
          fi
          cat check-config.log

      - name: 下载源码包
        run: make download -j"$(nproc)"

      - name: 编译
        run: |
          # 之前是 `make world 2>&1 | tee build.log`, 管道让 make 的失败被 tee 的
          # 退出码吞掉, 编译步骤永远显示 success, image 构建报错却看不到 (run #7 就是这样
          # 被误导成"没产出镜像")。改用 PIPESTATUS 抓真实退出码。
          # V=s 让 gcc 完整报错行 (error: ...) 留在 build.log, 否则只顶层
          # "ERROR: target/linux failed to build" 看不到具体哪个文件哪行 (run #9 就是这个坑)。
          # run #14 起加 -k: 6.18 旧 Kconfig 符号引发的 kmod 缺失是连锁的 (netfilter ->
          # SCSI -> ...), 打包阶段某个 kmod 缺 .ko 不再立刻中止, 让 make 把"所有"缺失
          # 模块一次性全跑出来; failure 步骤会把完整清单去重聚合成 annotation, 争取一次修完。
          make -k -j"$(nproc)" world V=s 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # 1) 优先把"打包阶段缺失的 .ko"作为 annotation 直接打出。这是 6.18 旧 Kconfig
            #    符号引发的真问题, 必须出现在可匿名阅读的 annotation 里, 不能被满屏的
            #    host-tool 噪声 (bison/help2man/elfutils...) 淹没。head -80 会把它们挤掉,
            #    所以这里单独抽出来、去重、逐条发 ::error:: (限 100 条避免 annotation 超限)。
            miss=$(grep -oE "ERROR: module '[^']+' is missing" build.log 2>/dev/null \
              | sed -E "s/ERROR: module '([^']+)' is missing/\1/" | sort -u)
            if [ -n "$miss" ]; then
              echo "=== 缺失的 .ko 模块 (去重, 共 $(echo "$miss" | wc -l) 个) ==="
              echo "$miss"
              echo "$miss" | head -100 | while IFS= read -r m; do
                printf '::error::缺失内核模块 .ko: %s (kmod 打包失败, 通常是 6.18 旧 Kconfig 符号未更新)\n' "$m"
              done
            fi
            # 2) 其余编译/配置错误 (过滤无害 host-tool 噪声), 取末 80 行进 annotation。
            #    不再 head -80: 早期 host-tool 噪声会挤掉真正的配置/编译根因。
            errs=$(grep -niE "error:|undefined reference|No such file or directory|recipe for target .* failed|make\[[0-9]*\]: \*\*\*" build.log \
              | grep -viE "ninja: No such file|install-info: No such file|curl: \(22\)|manifest: No such file|abort-due-to-no-makefile|Error [0-9] \(ignored\)" \
              | grep -viE "module is missing" \
              | tail -80)
            echo "=== 其它错误 (末 80 行) ==="
            echo "$errs"
            printf '::error::make world 失败 (rc=%s); 缺失模块见上方 annotation, 其余错误见下:: %s\n' "$rc" \
              "$(echo "$errs" | sed ':a;N;$!ba;s/\n/%0A/g')"
            # 3) 专门捕获内核 syncconfig 交互式提示中止: 6.18 新增的 Kconfig 符号若没在
            #    kmod 的 KCONFIG 里用 '=n'/取值行护卫, 非交互 CI 下会弹 '(NEW)' 提示,
            #    导致 scripts/kconfig/Makefile syncconfig Error 1 -> target/linux failed。
            #    这一条单独发 annotation, 一眼就能看出是"新增符号没护卫"而不是普通编译错。
            syncf=$(grep -nE "\(NEW\)|syncconfig\] Error|Export .* \[N/y|scripts/kconfig/Makefile.*syncconfig" build.log 2>/dev/null | head -20)
            if [ -n "$syncf" ]; then
              echo "=== 内核 syncconfig 交互式提示中止 (6.18 新增符号未用 =n 护卫) ==="
              echo "$syncf"
              echo "$syncf" | while IFS= read -r l; do
                printf '::error::内核 syncconfig 提示中止 (通常 6.18 新增 Kconfig 符号未用 =n/取值护卫): %s\n' "$l"
              done
            fi
            exit 1
          fi

      - name: 失败时给详细日志
        if: failure()
        run: |
          echo "=== 全部缺失的 .ko 模块 (make -k 攒出的完整清单, 去重, 用于一次性修复) ==="
          miss=$(grep -oE "ERROR: module '[^']+' is missing" build.log 2>/dev/null | sed -E "s/ERROR: module '([^']+)' is missing/\1/" | sort -u)
          echo "$miss" | head -200 || true
          # 同样逐条发 ::error::, 保证匿名也能在 annotation 里读到完整缺失清单
          echo "$miss" | head -100 | while IFS= read -r m; do
            printf '::error::(failure) 缺失内核模块 .ko: %s\n' "$m"
          done
          echo "(若上面为空但构建仍失败, 看下方 build.log 末段)"
          echo
          echo "=== resolved .config: 相关 Kconfig 符号状态 ==="
          grep -nE "CONFIG_NF_FLOW_TABLE|CONFIG_NF_CONNTRACK=|CONFIG_NETFILTER_NETLINK|CONFIG_NF_TPROXY|CONFIG_NF_CT_NETLINK|CONFIG_NFT_BRIDGE|CONFIG_NF_CONNTRACK_BRIDGE|CONFIG_NF_TABLES=|CONFIG_BRIDGE=|CONFIG_SCSI|CONFIG_SCSI_MOD|CONFIG_BLK_DEV_SD|CONFIG_SCSI_COMMON" .config 2>/dev/null || echo "(.config 不存在)"
          echo "=== build_dir 里是否真的产出了这些 .ko (定位是配置裁掉还是路径错) ==="
          find build_dir -name "nf_flow_table*.ko" -o -name "nf_tproxy*.ko" -o -name "nf_conntrack_netlink*.ko" -o -name "nft_*bridge*.ko" -o -name "nf_conntrack_bridge*.ko" -o -name "scsi_mod*.ko" -o -name "scsi_common*.ko" -o -name "sd_mod*.ko" 2>/dev/null | head || echo "(未找到任何相关 .ko)"
          echo "=== build.log 末 200 行 (总体上下文) ==="
          tail -n 200 build.log || true

      - name: 校验产物
        run: |
          set +e
          echo "=== bin/targets/airoha/an7581/ 内容 ==="
          ls -l bin/targets/airoha/an7581/ 2>&1 | tail -40
          itb=$(ls bin/targets/airoha/an7581/*.itb 2>/dev/null | head -n1)
          if [ -z "$itb" ]; then
            echo "=== build.log 关键错误 (辅助定位) ==="
            grep -iE "failed to build|Error 1|No rule to make|recipe for target .* failed|ERROR:" build.log 2>/dev/null | tail -30 || true
            printf '::error::没有生成 .itb:: %s\n' \
              "$(ls -1 bin/targets/airoha/an7581/ 2>&1 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "=== $itb ==="
          python3 pon-build/scripts/verify-firmware.py "$itb" > verify.log 2>&1
          rc=$?
          cat verify.log
          if [ "$rc" -ne 0 ]; then
            printf '::error::verify-firmware 失败 (rc=%s):: %s\n' "$rc" \
              "$(sed ':a;N;$!ba;s/\n/%0A/g' verify.log)"
          fi
          exit "$rc"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmd-${{ steps.ver.outputs.tag }}
          path: |
            build.log
            defconfig.log
            check-config.log
            verify.log
            .config
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30

      - name: 发布 Release
        # push 事件下 github.event.inputs 为 null, null != 'none' 恒为真 ->
        # 会误发 Release。必须同时限定事件类型。
        if: github.event_name == 'workflow_dispatch' && inputs.release_type != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.date }} - Nokia XG-040G-MD (${{ steps.ver.outputs.commit }})
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
