# ImmortalWrt + pbs05 PON feeds —— 为 Nokia XG-040G-MD (UBI) 准备
#
# 语法: src-git <name> <url>^<commit>
#   scripts/feeds 用 split(/\^/, $src) 解析, 先 clone 再 checkout 到该提交。
#
# !! 本文件里绝对不能出现"只有一个 # 字符"的行 !!
#   scripts/feeds 的 parse_file 用 s/#.+$// 去注释, 要求 # 后至少有一个字符;
#   光秃秃的 # 不会被剥掉, 随后匹配 src-<type> 失败 -> die "Syntax error ... line N",
#   feeds 退出码 25, 整个构建在前 3 分钟就挂掉。分隔只能用空行或"# 文字"。
#
# 为什么固定 (pin):
#   feeds 默认跟各仓库 HEAD 走。上游滚动后依赖会超前于已 pin 的源码,
#   表现不是报错, 而是旧配置里的符号被静默丢弃 —— 编译照样成功、固件却少了功能。
#   固定到同期提交才能让每次构建可复现。
#   不想用固定版本: workflow 手动运行时把 pin_feeds 设为 no。

src-git packages https://github.com/immortalwrt/packages.git^4a69a0b76759dcd6e2164c81d7260b5280d833c1
# luci 必须 pin 在 ed0441b1 (2026-10-02 "Merge Official Source") 或之后:
#   immortalwrt/luci 的 master 线在 2026-09 整段时间把 ~64 个第三方 LuCI 应用拆了出去,
#   那条线上 pin 的任何提交都没有 luci-app-openclash (applications 只有 103 项)。
#   ed0441b1 合回来后是 167 项, openclash / passwall / homeproxy / daed / zerotier 才重新可用。
src-git luci https://github.com/immortalwrt/luci.git^ed0441b14b0309afba9dba26aeca4e865c727d5c
src-git routing https://github.com/openwrt/routing.git^4b9891b9136259f93294a424507ed24c5e8c1cbd
src-git telephony https://github.com/openwrt/telephony.git^5d68d53c160a325ea9d03fce393e051573bcc736
src-git video https://github.com/openwrt/video.git^605d768782e13fc8b8fa16e719d4a2742dafbd45
# PON 驱动与用户态不再走 feed: 它们已经并进本仓库 package/airoha-pon/,
# 上游代码来源仍是 pbs05/openwrt-pon-drivers + openwrt-pon-userspace,
# 但版本随仓库固定, 不需要 feeds install 也能编出带 pon0 的固件。
